name: market_pos
description: "Market Management System (MMS) - Windows Client Application"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  drift: ^2.32.0
  flutter_riverpod: ^2.5.1
  google_sign_in: ^7.2.0
  http: ^1.2.2
  mobile_scanner: ^7.0.1
  path: ^1.9.0
  qr_flutter: ^4.1.0
  mms_client_storage:
    path: packages/mms_client_storage
  mms_contracts:
    path: packages/mms_contracts

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqlite3: ^3.1.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mms_logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
